name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.11"
          bundler-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install 'rendercv[full]==2.8' nbconvert
      - name: Render CV PDF
        working-directory: _data
        run: |
          rendercv render cv.yml \
            --settings ../assets/rendercv/settings.yaml \
            --design ../assets/rendercv/design.yaml \
            --locale-catalog ../assets/rendercv/locale.yaml
          test -s ../assets/rendercv/rendercv_output/Gia_Phong_Ngo_CV.pdf
      - name: Build Jekyll site
        run: |
          bundle exec jekyll build
          test -s _site/index.html
          test -s _site/assets/rendercv/rendercv_output/Gia_Phong_Ngo_CV.pdf
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
